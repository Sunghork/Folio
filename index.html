<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Folio PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600&family=Mrs+Saint+Delafield&family=La+Belle+Aurore&display=swap">
<style>
/* Layout: dark app bar over a quiet document workspace — tools left, page canvas center, panels right. */
:root{
  --font-ui:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg:#F4F4F2; --chrome:#FFFFFF; --chrome-2:#F6F6F4; --hover:#EEEEEB; --press:#E4E4E0;
  --canvas:#E3E4E1; --line:#E3E3DF; --line-2:#D2D3CE;
  --ink:#17181A; --ink-2:#4A4D53; --ink-3:#85888E;
  --accent:#0B6B66; --accent-hover:#085752; --accent-ink:#FFFFFF; --accent-soft:#E1F0EE; --accent-line:#9CCFC8;
  --appbar:#151719; --appbar-2:#202326; --appbar-ink:#ECEDED; --appbar-ink-2:#979BA1; --appbar-hover:#2A2D31;
  --danger:#C2362B; --danger-soft:#FBE9E7; --ok:#1E8A4C; --warn:#B26B12;
  --tile-1:#E1F0EE; --tile-2:#FCEBDD; --tile-3:#E6EAFB; --tile-4:#F6E4EE; --tile-5:#E9F3DF; --tile-6:#EFE9DD;
  --tile-ink-1:#0B6B66; --tile-ink-2:#B4531A; --tile-ink-3:#3248B5; --tile-ink-4:#A23670; --tile-ink-5:#3E7A1E; --tile-ink-6:#7A5B22;
  --shadow-1:0 1px 2px rgba(18,20,24,.06), 0 1px 1px rgba(18,20,24,.04);
  --shadow-2:0 10px 30px rgba(18,20,24,.14), 0 2px 8px rgba(18,20,24,.08);
  --shadow-float:0 6px 20px rgba(18,20,24,.12), 0 1px 3px rgba(18,20,24,.10);
  --page-shadow:0 1px 2px rgba(0,0,0,.10), 0 8px 24px rgba(0,0,0,.08);
  --sel:#0B6B66;
  --r-sm:6px; --r:8px; --r-lg:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131415; --chrome:#1B1C1E; --chrome-2:#1F2123; --hover:#292B2E; --press:#323539;
    --canvas:#0E0F10; --line:#2B2D30; --line-2:#3A3D41;
    --ink:#ECEDEE; --ink-2:#B5B8BD; --ink-3:#7D8187;
    --accent:#3CBDB1; --accent-hover:#5BCFC4; --accent-ink:#04201D; --accent-soft:#15302D; --accent-line:#236059;
    --appbar:#0A0B0C; --appbar-2:#16181A; --appbar-hover:#24272A;
    --danger:#F0675B; --danger-soft:#3A1A17; --ok:#4CC27F; --warn:#E3A24A;
    --tile-1:#15302D; --tile-2:#3A2516; --tile-3:#1D2440; --tile-4:#38192A; --tile-5:#1E2E15; --tile-6:#30291A;
    --tile-ink-1:#5BCFC4; --tile-ink-2:#F2A167; --tile-ink-3:#8FA2F5; --tile-ink-4:#E886BA; --tile-ink-5:#9BD47A; --tile-ink-6:#D8B878;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 12px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
    --shadow-float:0 8px 24px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
    --page-shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45);
    --sel:#3CBDB1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131415; --chrome:#1B1C1E; --chrome-2:#1F2123; --hover:#292B2E; --press:#323539;
  --canvas:#0E0F10; --line:#2B2D30; --line-2:#3A3D41;
  --ink:#ECEDEE; --ink-2:#B5B8BD; --ink-3:#7D8187;
  --accent:#3CBDB1; --accent-hover:#5BCFC4; --accent-ink:#04201D; --accent-soft:#15302D; --accent-line:#236059;
  --appbar:#0A0B0C; --appbar-2:#16181A; --appbar-hover:#24272A;
  --danger:#F0675B; --danger-soft:#3A1A17; --ok:#4CC27F; --warn:#E3A24A;
  --tile-1:#15302D; --tile-2:#3A2516; --tile-3:#1D2440; --tile-4:#38192A; --tile-5:#1E2E15; --tile-6:#30291A;
  --tile-ink-1:#5BCFC4; --tile-ink-2:#F2A167; --tile-ink-3:#8FA2F5; --tile-ink-4:#E886BA; --tile-ink-5:#9BD47A; --tile-ink-6:#D8B878;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 12px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  --shadow-float:0 8px 24px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --page-shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45);
  --sel:#3CBDB1;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{flex:none;display:block}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#app{height:100%;display:flex;flex-direction:column;min-height:0}

/* ---------- App bar ---------- */
.appbar{flex:none;height:46px;display:flex;align-items:center;gap:14px;background:var(--appbar);color:var(--appbar-ink);
  padding-left:max(14px, env(safe-area-inset-left,0px));padding-right:max(14px, env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;flex:none;font-weight:700;letter-spacing:-.01em;font-size:15px}
.brand-mark{width:22px;height:22px;border-radius:5px;position:relative;background:linear-gradient(145deg,#2FB3A7,#0B6B66 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.brand-mark::after{content:"";position:absolute;right:4px;top:4px;width:8px;height:8px;background:var(--appbar);border-bottom-left-radius:4px}
.brand-mark::before{content:"";position:absolute;left:5px;bottom:5px;width:9px;height:2px;border-radius:2px;background:#fff;box-shadow:0 -4px 0 #fff}
.tabs{display:flex;align-items:stretch;gap:2px;height:100%;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;height:34px;margin-top:12px;border-radius:8px 8px 0 0;color:var(--appbar-ink-2);white-space:nowrap;max-width:240px;flex:none;position:relative}
.tab:hover{color:var(--appbar-ink);background:var(--appbar-hover)}
.tab.on{background:var(--bg);color:var(--ink)}
.tab .tname{overflow:hidden;text-overflow:ellipsis;font-weight:500}
.tab .tclose{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;opacity:.6}
.tab .tclose:hover{opacity:1;background:rgba(127,127,127,.2)}
.tab .tdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.tab.home-tab{padding:0 12px}
.appbar-actions{display:flex;align-items:center;gap:4px;flex:none}
.ab-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--appbar-ink-2)}
.ab-btn:hover{background:var(--appbar-hover);color:var(--appbar-ink)}
.avatar{width:28px;height:28px;border-radius:50%;background:#C9D9D6;color:#0B3F3C;font-weight:700;font-size:12px;margin-left:6px;display:grid;place-items:center}

/* ---------- Buttons ---------- */
.btn-ghost{height:32px;padding:0 10px;border-radius:var(--r);display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.btn-ghost:hover{background:var(--hover);color:var(--ink)}
.btn-ghost:active{background:var(--press)}
.btn-ghost:disabled{opacity:.38;pointer-events:none}
.btn-ghost.icon{width:32px;padding:0;justify-content:center}
.btn-ghost.sm{height:26px;width:26px}
.btn-ghost.on{background:var(--accent-soft);color:var(--accent)}
.btn-primary{height:32px;padding:0 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{opacity:.45;pointer-events:none}
.btn-line{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);font-weight:600;display:inline-flex;align-items:center;gap:7px;color:var(--ink);background:var(--chrome);white-space:nowrap}
.btn-line:hover{background:var(--hover)}
.btn-danger{height:32px;padding:0 14px;border-radius:999px;background:var(--danger);color:#fff;font-weight:600}
.btn-text{color:var(--accent);font-weight:600;padding:4px 6px;border-radius:6px}
.btn-text:hover{background:var(--accent-soft)}
.vsep{width:1px;height:20px;background:var(--line-2);margin:0 6px;flex:none}

/* tooltip */
[data-tip]{position:relative}
.tipbox{position:fixed;z-index:200;pointer-events:none;background:#1E2023;color:#F2F3F3;font-size:11.5px;font-weight:500;padding:5px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25);opacity:0;transform:translateY(2px);transition:opacity .12s,transform .12s}
.tipbox.show{opacity:1;transform:none}
.tipbox kbd{font-family:var(--font-mono);font-size:10.5px;color:#9EA3A9;margin-left:6px}

/* ---------- Home ---------- */
.home{flex:1;overflow:auto;padding-block:36px 64px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.home-inner{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.home-head h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0;font-weight:600;text-wrap:balance}
.home-head p{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.drop{border:1.5px dashed var(--line-2);border-radius:16px;background:var(--chrome);padding:28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop-art{width:72px;height:88px;flex:none;position:relative}
.drop-art .sheet{position:absolute;inset:0;border-radius:8px;background:var(--chrome-2);border:1px solid var(--line-2)}
.drop-art .sheet.back{transform:rotate(-7deg) translate(-6px,4px)}
.drop-art .sheet.front{background:var(--chrome);display:flex;flex-direction:column;gap:6px;padding:16px 12px}
.drop-art .sheet.front i{display:block;height:4px;border-radius:2px;background:var(--line-2)}
.drop-art .sheet.front i:first-child{width:60%;background:var(--accent)}
.drop-art .sheet.front i:nth-child(3){width:80%}
.drop-text{flex:1;min-width:220px}
.drop-text h2{margin:0;font-size:17px;font-weight:600}
.drop-text p{margin:4px 0 0;color:var(--ink-2)}
.drop-actions{display:flex;gap:8px;flex-wrap:wrap}
.sec-title{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tool-card{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border-radius:var(--r-lg);background:var(--chrome);border:1px solid var(--line);transition:border-color .15s, box-shadow .15s, transform .15s}
.tool-card:hover{border-color:var(--line-2);box-shadow:var(--shadow-float);transform:translateY(-1px)}
.tool-card .tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.tool-card strong{display:block;font-size:14px;font-weight:600}
.tool-card span{display:block;color:var(--ink-2);margin-top:2px;font-size:12.5px;line-height:1.4}
.recent{background:var(--chrome);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.recent-row{display:grid;grid-template-columns:minmax(0,1fr) 80px 90px 140px 40px;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);text-align:left;width:100%}
.recent-row:first-child{border-top:0}
.recent-row.head{color:var(--ink-3);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--chrome-2)}
.recent-row:not(.head):hover{background:var(--hover)}
.recent-row .rname{display:flex;align-items:center;gap:10px;min-width:0;font-weight:500}
.recent-row .rname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-row .num{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.file-ic{width:26px;height:32px;border-radius:4px;background:var(--danger-soft);color:var(--danger);font-size:8px;font-weight:700;display:grid;place-items:end center;padding-bottom:4px;flex:none;position:relative;letter-spacing:.04em}
.file-ic::after{content:"";position:absolute;right:0;top:0;width:8px;height:8px;background:var(--chrome);border-bottom-left-radius:3px;box-shadow:-1px 1px 0 rgba(0,0,0,.06)}
.empty-note{padding:22px 16px;color:var(--ink-3)}

/* ---------- Workspace ---------- */
.workspace{flex:1;display:flex;flex-direction:column;min-height:0}
.docbar{flex:none;height:50px;display:flex;align-items:center;gap:8px;background:var(--chrome);border-bottom:1px solid var(--line);
  padding-left:max(10px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px))}
.db-left,.db-mid,.db-right{display:flex;align-items:center;gap:4px;min-width:0}
.db-left{flex:1}
.db-right{flex:1;justify-content:flex-end}
.docname{display:flex;align-items:center;gap:8px;min-width:0;padding:0 6px;font-weight:600;font-size:13.5px}
.docname span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dirty{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.seg{display:flex;background:var(--chrome-2);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{height:26px;padding:0 14px;border-radius:999px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--chrome);color:var(--ink);box-shadow:var(--shadow-1)}
.mobile-only{display:none}

.ws-body{flex:1;display:flex;min-height:0;position:relative}
.toolsPanel{width:252px;flex:none;background:var(--chrome);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px 24px}
.toolsPanel.closed{display:none}
.tp-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.tp-head h2{margin:0;font-size:14px;font-weight:600}
.tp-group{padding:8px 0 4px}
.tp-group h3{margin:0;padding:6px 8px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tp-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:var(--r);text-align:left;color:var(--ink);font-weight:450}
.tp-item:hover{background:var(--hover)}
.tp-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tp-item .tpi{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none}
.tp-item kbd{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 4px}

.stage{flex:1;position:relative;min-width:0;background:var(--canvas);overflow:hidden}
.viewer{position:absolute;inset:0;overflow:auto;outline:none}
.pages{display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 76px 120px;width:max-content;min-width:100%;margin:0 auto}
.pages.spread{flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:flex-start;margin:0 auto}
.pages.single .page:not(.cur){display:none}
.page{position:relative;background:#fff;box-shadow:var(--page-shadow);flex:none;contain:layout}
.page canvas.pc{position:absolute;inset:0;width:100%;height:100%;display:block}
.page.cur{box-shadow:var(--page-shadow), 0 0 0 1px rgba(11,107,102,.0)}
.layer{position:absolute;left:0;top:0;transform-origin:0 0}
.tl{position:absolute;inset:0;line-height:1;overflow:hidden}
.tl span{position:absolute;white-space:pre;color:transparent;transform-origin:0 0;cursor:text;font-family:sans-serif}
.tl ::selection{background:rgba(11,107,102,.30)}
.viewer:not(.t-select) .tl{pointer-events:none;user-select:none}
.ol{position:absolute;inset:0;overflow:visible;pointer-events:none}
.viewer.t-select .ol .an{pointer-events:auto;cursor:move}
.viewer.t-select .ol .an.tx-an .tx{cursor:move}
.viewer.t-select .ol [data-handle]{pointer-events:auto;cursor:nwse-resize}
.viewer.t-hand{cursor:grab}
.viewer.t-hand.panning{cursor:grabbing}
.viewer.t-hand .page *{pointer-events:none!important}
.viewer.t-draw .page{cursor:crosshair;touch-action:none}
.viewer.t-place .page{cursor:copy;touch-action:none}
.viewer.t-textcur .page{cursor:text}
.ol .tx{display:block;padding:0;margin:0;white-space:pre-wrap;word-break:normal;overflow-wrap:break-word;line-break:auto;outline:none;font-variant-ligatures:no-common-ligatures;font-kerning:normal}
.ol .tx[contenteditable]{cursor:text;box-shadow:0 0 0 1px var(--sel), 0 0 0 4px rgba(11,107,102,.12);border-radius:1px;caret-color:var(--sel)}
.ol .blk{fill:#0B6B66;fill-opacity:.035;stroke:#0B6B66;stroke-opacity:.45;stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.ol .blk.on{fill-opacity:.08;stroke-opacity:1;stroke-dasharray:none}
.ol .reading{fill:#0B6B66;fill-opacity:.08;stroke:#0B6B66;stroke-width:1.5;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;animation:march .6s linear infinite}
@keyframes march{to{stroke-dashoffset:-20}}
.ol .selbox{fill:none;stroke:var(--sel);stroke-width:1.25px;stroke-dasharray:4 3}
.ol .hdl{fill:#fff;stroke:var(--sel);stroke-width:1.5px}
.ol .hit{fill:#FFB300;fill-opacity:.32}
.ol .hit.cur{fill:#FF7A00;fill-opacity:.45}
.ol .an:hover .rd{fill-opacity:.22}

/* floating chrome */
.quickbar{position:absolute;left:14px;top:14px;z-index:5;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--chrome);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-float)}
.qb-btn{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);position:relative}
.qb-btn:hover{background:var(--hover);color:var(--ink)}
.qb-btn.on{background:var(--accent);color:var(--accent-ink)}
.qb-btn .dot{position:absolute;right:6px;bottom:6px;width:6px;height:6px;border-radius:50%;border:1.5px solid var(--chrome)}
.qb-sep{height:1px;background:var(--line);margin:4px 6px}
.optbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:4px;padding:5px 8px 5px 12px;background:var(--chrome);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-float);width:max-content;max-width:calc(100% - 96px);flex-wrap:wrap;row-gap:4px}
.ob-title{font-weight:600;display:flex;align-items:center;gap:8px;padding-right:6px;white-space:nowrap}
.ob-hint{color:var(--ink-3);font-size:12px;white-space:nowrap}
.ob-sep{width:1px;height:20px;background:var(--line-2);margin:0 4px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--chrome);box-shadow:0 0 0 1px var(--line-2);flex:none}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.chip{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.chip:hover{background:var(--hover)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ob-select{height:28px;border-radius:7px;border:1px solid var(--line-2);background:var(--chrome);padding:0 6px}
.sig-chip{height:34px;padding:2px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.sig-chip img{max-height:28px;max-width:110px}
.sig-chip.on{box-shadow:0 0 0 2px var(--accent)}

.searchbar{position:absolute;top:14px;right:14px;z-index:7;display:flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;background:var(--chrome);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-float);width:min(360px, calc(100% - 28px))}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:none;height:30px}
.sb-ic{color:var(--ink-3)}
.sb-count{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.selpop{position:absolute;z-index:8;display:flex;gap:2px;padding:4px;background:#1E2023;border-radius:10px;box-shadow:var(--shadow-2)}
.selpop button{height:30px;padding:0 9px;border-radius:7px;color:#ECEDED;display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px}
.selpop button:hover{background:#34383C}
.pagepill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:2px;padding:5px;background:var(--chrome);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-float)}
.pp-btn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.pp-btn:hover{background:var(--hover);color:var(--ink)}
.pp-btn.on{color:var(--accent)}
.pp-page{display:flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:12px;color:var(--ink-2);padding:0 4px;font-variant-numeric:tabular-nums}
.pp-page input{width:38px;height:26px;text-align:center;border:1px solid var(--line-2);border-radius:6px;background:var(--chrome-2);font-family:var(--font-mono);font-size:12px}
.pp-zoom{min-width:54px;height:30px;border-radius:999px;font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
.pp-zoom:hover{background:var(--hover)}
.pp-sep{width:1px;height:18px;background:var(--line-2);margin:0 4px}

/* ---------- Side panel / rail ---------- */
.sidepanel{width:300px;flex:none;background:var(--chrome);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sidepanel.closed{display:none}
.sp-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--line)}
.sp-head h2{margin:0;font-size:14px;font-weight:600;display:flex;align-items:baseline;gap:8px}
.sp-head h2 small{font-family:var(--font-mono);font-weight:400;font-size:11px;color:var(--ink-3)}
.sp-body{flex:1;overflow-y:auto;min-height:0}
.rail{width:48px;flex:none;background:var(--chrome);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
.rail-btn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);position:relative}
.rail-btn:hover{background:var(--hover);color:var(--ink)}
.rail-btn.on{background:var(--accent-soft);color:var(--accent)}
.rail-btn .badge{position:absolute;top:3px;right:2px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px;font-family:var(--font-mono)}

.thumbs{display:grid;grid-template-columns:1fr;gap:14px;padding:16px 0 32px;justify-items:center}
.th-item{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:8px;padding:6px}
.th-frame{position:relative;background:#fff;box-shadow:0 0 0 1px var(--line-2), var(--shadow-1);overflow:hidden}
.th-item:hover .th-frame{box-shadow:0 0 0 1px var(--ink-3), var(--shadow-1)}
.th-item.cur .th-frame{box-shadow:0 0 0 2.5px var(--accent)}
.th-item .lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.th-item.cur .lbl{color:var(--accent);font-weight:500}
.thumbc{position:absolute;inset:0;width:100%;height:100%}
.th-ol{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.th-ol svg{display:block;overflow:visible}

.cm-tools{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cm-tools input{flex:1;min-width:120px;height:30px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;background:var(--chrome-2)}
.cm-page{padding:12px 16px 4px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.cm{margin:6px 10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--chrome);cursor:pointer}
.cm:hover{border-color:var(--line-2)}
.cm.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cm-top{display:flex;align-items:center;gap:8px}
.cm-glyph{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;color:#2A2B2E}
.cm-who{font-weight:600;font-size:12.5px}
.cm-when{color:var(--ink-3);font-size:11.5px;margin-left:auto;white-space:nowrap}
.cm-type{color:var(--ink-3);font-size:11.5px}
.cm-quote{margin:8px 0 0;padding-left:9px;border-left:2px solid var(--line-2);color:var(--ink-2);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cm textarea{width:100%;margin-top:8px;border:1px solid transparent;background:var(--chrome-2);border-radius:7px;padding:6px 8px;resize:none;min-height:32px;font-size:12.5px;line-height:1.4}
.cm textarea:focus{border-color:var(--accent);background:var(--chrome);outline:none}
.cm-actions{display:flex;justify-content:flex-end;gap:2px;margin-top:4px;opacity:0;transition:opacity .12s}
.cm:hover .cm-actions,.cm.on .cm-actions{opacity:1}
.sp-empty{padding:40px 24px;text-align:center;color:var(--ink-3)}
.sp-empty strong{display:block;color:var(--ink-2);margin:12px 0 4px;font-size:13.5px}
.sp-empty .big{width:44px;height:44px;margin:0 auto;border-radius:12px;background:var(--chrome-2);display:grid;place-items:center;color:var(--ink-3)}
.bm{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 14px;border-radius:0;color:var(--ink)}
.bm:hover{background:var(--hover)}
.form{display:flex;flex-direction:column;gap:14px;padding:16px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .flabel{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.field input[type=text],.field textarea,.field select{height:34px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;background:var(--chrome);width:100%}
.field textarea{height:auto;padding:8px 10px;resize:vertical}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:4px 16px 20px;font-size:12.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;text-align:right;font-family:var(--font-mono);font-size:11.5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.subhead{padding:14px 16px 6px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-top:1px solid var(--line)}

/* ---------- Organizer ---------- */
.organizer{position:absolute;inset:0;overflow:auto;background:var(--canvas)}
.org-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 16px;background:var(--chrome);border-bottom:1px solid var(--line)}
.org-bar .ttl{font-weight:600;margin-right:8px}
.org-bar .cnt{color:var(--ink-3);font-size:12px;margin-right:auto}
.org-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:26px 18px;padding:28px 24px 80px;align-items:end}
.org-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border-radius:12px;position:relative;user-select:none}
.org-card:hover{background:rgba(127,127,127,.08)}
.org-card.sel{background:var(--accent-soft)}
.org-card.sel .th-frame{box-shadow:0 0 0 2.5px var(--accent)}
.org-card.drop-before::before,.org-card.drop-after::after{content:"";position:absolute;top:10px;bottom:30px;width:3px;border-radius:2px;background:var(--accent)}
.org-card.drop-before::before{left:-11px}
.org-card.drop-after::after{right:-11px}
.org-card.dragging{opacity:.35}
.org-card .lbl{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2)}
.org-hover{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:3px;background:var(--chrome);border-radius:9px;box-shadow:var(--shadow-float);opacity:0;transition:opacity .12s}
.org-card:hover .org-hover,.org-card:focus-within .org-hover{opacity:1}
.org-hover button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2)}
.org-hover button:hover{background:var(--hover);color:var(--ink)}
.org-insert{position:absolute;right:-17px;top:50%;width:24px;height:24px;margin-top:-24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;opacity:0;transform:scale(.8);transition:opacity .12s, transform .12s;z-index:2}
.org-card:hover .org-insert{opacity:1;transform:none}

/* ---------- Menus, modals, toasts ---------- */
.menu{position:fixed;z-index:120;min-width:220px;padding:6px;background:var(--chrome);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:7px;text-align:left;color:var(--ink);white-space:nowrap}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi .mk{margin-left:auto;padding-left:18px;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.mi .ck{width:16px;color:var(--accent)}
.mi:disabled{opacity:.4;pointer-events:none}
.msep{height:1px;background:var(--line);margin:5px 4px}
.mhead{padding:6px 10px 4px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.modal-ov{position:fixed;inset:0;z-index:150;background:rgba(10,12,14,.45);display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-height:calc(100% - 32px);display:flex;flex-direction:column;background:var(--chrome);border-radius:16px;box-shadow:var(--shadow-2);overflow:hidden;animation:pop .16s ease-out}
.md-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 4px 22px}
.md-head h2{margin:0;font-size:16px;font-weight:600}
.md-body{padding:12px 22px 6px;overflow-y:auto;min-height:0}
.md-body p{margin:0 0 10px;color:var(--ink-2)}
.md-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 18px;flex-wrap:wrap}
.md-foot .spacer{margin-right:auto}
.tabs-in{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs-in button{padding:8px 12px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs-in button.on{color:var(--ink);border-bottom-color:var(--accent)}
.sigpad{width:100%;height:180px;border:1px solid var(--line-2);border-radius:10px;background:#fff;touch-action:none;display:block;cursor:crosshair}
.sig-opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.sig-opt{height:64px;border:1px solid var(--line-2);border-radius:10px;background:#fff;color:#14161A;display:flex;align-items:center;padding:0 18px;font-size:34px;overflow:hidden;white-space:nowrap}
.sig-opt.on{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.preview-page{width:100%;aspect-ratio:8.5/11;max-height:260px;background:#fff;border-radius:6px;box-shadow:0 0 0 1px var(--line-2);position:relative;overflow:hidden;margin:4px auto 0;max-width:200px}
.preview-page svg{position:absolute;inset:0;width:100%;height:100%}
.keys{display:grid;grid-template-columns:1fr auto;gap:8px 18px;font-size:13px}
.keys kbd{font-family:var(--font-mono);font-size:11.5px;padding:2px 6px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;background:var(--chrome-2);white-space:nowrap}
.keys .kh{grid-column:1/-1;margin-top:10px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.toasts{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;padding:0 16px;width:100%}
.toast{background:#1E2023;color:#F1F2F2;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-2);font-weight:500;display:flex;align-items:center;gap:10px;animation:pop .18s ease-out;max-width:min(520px,100%)}
.toast .tk{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;background:#2E8C64;color:#fff}
.toast.err .tk{background:#C2362B}
.toast.info .tk{background:#3B5BC4}
.dropveil{position:fixed;inset:0;z-index:250;background:rgba(11,107,102,.14);border:3px dashed var(--accent);display:grid;place-items:center;pointer-events:none}
.dropveil>div{background:var(--chrome);border-radius:16px;padding:22px 30px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--accent)}
.dropveil strong{color:var(--ink);font-size:15px}
.dropveil small{color:var(--ink-3)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);z-index:9;background:var(--canvas)}
.spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Form fields ---------- */
.forms{position:absolute;inset:0;pointer-events:none}
.viewer.t-select .forms .ff{pointer-events:auto}
.ff{position:absolute;margin:0;border:0;border-radius:0;padding:0 2px;background:rgba(36,86,199,.10);box-shadow:inset 0 0 0 .6px rgba(36,86,199,.45);color:#000;outline:none;line-height:1.15;font-family:Helvetica, Arial, sans-serif}
.ff:hover{background:rgba(36,86,199,.16)}
.ff:focus{background:rgba(255,255,255,.92);box-shadow:inset 0 0 0 1.2px #2456C7}
.ff:disabled{background:transparent;box-shadow:none;color:#333}
textarea.ff{resize:none;padding:2px;line-height:1.2}
select.ff{appearance:auto;padding:0}
.ff-check,.ff-radio{display:grid;place-items:center;color:#111;padding:0}
.ff-check svg{width:80%;height:80%;opacity:0}
.ff-check.on svg{opacity:1}
.ff-radio{border-radius:50%}
.ff-radio i{width:45%;height:45%;border-radius:50%;background:#111;opacity:0}
.ff-radio.on i{opacity:1}

/* ---------- Text editing ---------- */
.font-btn{height:28px;max-width:190px;display:inline-flex;align-items:center;gap:6px;padding:0 8px 0 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--chrome);color:var(--ink);font-weight:500}
.font-btn:hover{background:var(--hover)}
.fb-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.color-in{width:26px;height:26px;padding:0;border:1px solid var(--line-2);border-radius:50%;background:none;cursor:pointer;overflow:hidden}
.color-in::-webkit-color-swatch-wrapper{padding:2px}
.color-in::-webkit-color-swatch{border:0;border-radius:50%}
.color-btn{height:28px;display:inline-flex;align-items:center;gap:4px;padding:0 6px 0 5px;border-radius:7px;color:var(--ink-2)}
.color-btn:hover{background:var(--hover)}
.cb-dot{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 1px var(--line-2), inset 0 0 0 2px var(--chrome)}
.color-menu{padding:10px;min-width:0;width:212px}
.cm-grid{display:grid;grid-template-columns:repeat(6, 26px);gap:8px;justify-content:space-between}
.cm-grid .sw{width:26px;height:26px}
.cm-custom{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--ink-2);font-size:12.5px;cursor:pointer}
.src-chip{cursor:default;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--tile-5);color:var(--tile-ink-5);font-size:11.5px;font-weight:600;white-space:nowrap}
.src-chip.warn{background:var(--tile-2);color:var(--tile-ink-2)}
.font-menu{width:min(360px, calc(100vw - 16px));padding:0;display:flex;flex-direction:column;max-height:min(460px, calc(100vh - 80px));overflow:hidden}
.fm-search{margin:8px;height:32px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;background:var(--chrome-2);outline:none}
.fm-search:focus{border-color:var(--accent)}
.fm-list{overflow-y:auto;padding:0 6px 6px;min-height:0}
.fm-item{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:center}
.fm-item.cur{background:var(--accent-soft)}
.fm-text{display:flex;flex-direction:column;min-width:0}
.fm-label{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.fm-text small{color:var(--ink-3);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.fm-sample{font-size:18px;line-height:1.3;color:var(--ink-2);opacity:0;transition:opacity .2s;max-width:130px;overflow:hidden;white-space:nowrap}
.fm-item.ready .fm-sample{opacity:1}

/* ---------- OCR ---------- */
.floatcard{position:absolute;right:14px;bottom:124px;z-index:8;width:min(360px, calc(100% - 28px));background:var(--chrome);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-float);padding:14px;display:flex;flex-direction:column;gap:12px;animation:pop .18s ease-out;transition:opacity .5s}
.floatcard.fade{opacity:0}
.fc-top{display:flex;gap:12px;align-items:flex-start}
.fc-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--tile-3);color:var(--tile-ink-3)}
.fc-ic.ok{background:var(--tile-5);color:var(--tile-ink-5)}
.fc-ic.err{background:var(--danger-soft);color:var(--danger)}
.fc-ic.spin-ic{position:relative;overflow:hidden}
.fc-ic.spin-ic::after{content:"";position:absolute;left:6px;right:6px;height:2px;border-radius:1px;background:currentColor;top:8px;animation:icscan 1.1s ease-in-out infinite alternate}
@keyframes icscan{to{top:26px}}
.fc-title{font-weight:600;font-size:13.5px;line-height:1.3}
.fc-sub{color:var(--ink-2);font-size:12.5px;margin-top:3px;line-height:1.45}
.fc-pct{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:2px}
.fc-actions{display:flex;justify-content:flex-end;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--chrome-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s ease}
.fc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fc-stat{background:var(--chrome-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.fc-stat strong{font-family:var(--font-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.fc-stat span{font-size:11px;color:var(--ink-3)}
.fc-stat.warn strong{color:var(--warn)}
.page.ocr-busy::after{content:"";position:absolute;left:0;right:0;top:0;height:72px;pointer-events:none;background:linear-gradient(to bottom, rgba(18,181,166,0), rgba(18,181,166,.22) 70%, rgba(18,181,166,.55) 100%);border-bottom:2px solid rgba(11,143,132,.8);animation:sweep 1.8s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes sweep{to{top:calc(100% - 72px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip span{display:inline-flex}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.check span{display:flex;flex-direction:column;gap:1px}
.check strong{font-weight:600;font-size:13px}
.check small{color:var(--ink-3);font-size:12px}
.fine{display:flex;gap:8px;align-items:flex-start;color:var(--ink-3);font-size:12px;margin:0;padding:10px 12px;background:var(--chrome-2);border-radius:9px}
.fine span{color:var(--accent);padding-top:1px}
.form .seg{align-self:flex-start;flex-wrap:wrap}

/* ---------- Responsive ---------- */
@media (max-width: 1100px){
  .sidepanel{position:absolute;right:48px;top:0;bottom:0;z-index:20;box-shadow:var(--shadow-2)}
}
@media (max-width: 860px){
  .toolsPanel{position:absolute;left:0;top:0;bottom:0;z-index:21;box-shadow:var(--shadow-2)}
  .toolsPanel:not(.open){display:none}
  .toolsPanel.closed.open{display:block}
  .db-mid .vsep,.db-mid #btnUndo,.db-mid #btnRedo{display:none}
}
@media (max-width: 720px){
  .appbar{gap:8px}
  .brand-name{display:none}
  #btnKeys{display:none}
  .rail{display:none}
  .mobile-only{display:inline-flex}
  .sidepanel{right:0;width:min(320px, 88vw)}
  .docname{display:none}
  #btnMenu .lbl{display:none}

/** Promise-based dialog. actions: [{label, value, kind}] ; resolves with the clicked value (or null on dismiss). */
function modal({ title, body, actions = [], width = 460, onOpen }) {
  return new Promise(resolve => {
    const prevFocus = document.activeElement;
    const close = v => { ov.remove(); document.removeEventListener('keydown', onKey, true); prevFocus && prevFocus.focus && prevFocus.focus({ preventScroll: true }); resolve(v); };
    const foot = h('div', { class: 'md-foot' });
    for (const a of actions) {
      const b = h('button', { type: 'button', class: a.kind === 'primary' ? 'btn-primary' : a.kind === 'danger' ? 'btn-danger' : 'btn-line', ...(a.left ? { style: { marginRight: 'auto' } } : {}) }, a.label);
      b.addEventListener('click', async () => { if (a.validate && !(await a.validate())) return; close(a.value); });
      foot.append(b);
    }
    const dlg = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title, style: { maxWidth: width + 'px' } },
      h('div', { class: 'md-head' }, h('h2', null, title), h('button', { class: 'btn-ghost icon', type: 'button', 'aria-label': 'Close', html: ic('x'), onclick: () => close(null) })),
      h('div', { class: 'md-body' }, body), actions.length ? foot : null);
    const ov = h('div', { class: 'modal-ov' }, dlg);
    ov.addEventListener('pointerdown', e => { if (e.target === ov) close(null); });
    const onKey = e => {
      if (e.key === 'Escape') { e.stopPropagation(); close(null); }
      if (e.key === 'Enter' && !e.target.closest('textarea') && actions.length) { const p = actions.find(a => a.kind === 'primary'); if (p && e.target.tagName !== 'BUTTON') { e.preventDefault(); [...foot.children][actions.indexOf(p)].click(); } }
    };
    document.addEventListener('keydown', onKey, true);
    $('#modalRoot').append(ov);
    onOpen && onOpen(dlg);
    (dlg.querySelector('input,textarea,select') || dlg.querySelector('.btn-primary'))?.focus({ preventScroll: true });
  });
}
const confirmDlg = (title, text, ok = 'Continue', kind = 'primary') => modal({ title, body: h('p', null, text), actions: [{ label: 'Cancel', value: false }, { label: ok, value: true, kind }] });

async function createWorkspace(name, bytes) {

}

/* open a set of files: PDFs open (or insert), images become pages */
async function openFiles(files, { into = null, at = null } = {}) {
  files = [...files].filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name) || /^image\//.test(f.type));
  if (!files.length) { toast('Choose a PDF or an image file', 'err'); return; }
  const busy = showBusy(into ? 'Adding pages…' : 'Opening…');
  try {
    if (into) {
      let pos = at ?? into.pages.length; const before = snapshot(); let added = 0;
      for (const f of files) {
        const bytes = /^image\//.test(f.type) ? await imagesToPdf([f]) : await readFile(f);
        const { pages } = await addDocBytes(into, bytes, f.name);
        into.pages.splice(pos, 0, ...pages); pos += pages.length; added += pages.length;
      }
      pushHistory(before); sync(); toast(`Added ${added} page${added === 1 ? '' : 's'}`);
      return;
    }
    let last = null;
    const pdfs = files.filter(f => !/^image\//.test(f.type)), imgs = files.filter(f => /^image\//.test(f.type));
    for (const f of pdfs) { try { last = await createWorkspace(f.name, await readFile(f)); } catch (e) { console.error(e); toast(`“${f.name}” could not be opened. It may be damaged or password-protected.`, 'err'); } }
    if (imgs.length) { const name = imgs.length === 1 ? imgs[0].name.replace(/\.[^.]+$/, '') + '.pdf' : 'Images.pdf'; last = await createWorkspace(name, await imagesToPdf(imgs)); }
    if (last) activate(last);
  } finally { busy(); }
}

  const el = h('div', { class: 'loading' }, h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '12px' } }, h('div', { class: 'spinner' }), label));

async function imagesToPdf(files) {
  const d = await PL.PDFDocument.create();
  for (const f of files) {
    const n = await normalizeImage(await readDataURL(f));
    const bytes = dataUrlBytes(n.url);
    const img = /jpeg/.test(n.url.slice(0, 20)) ? await d.embedJpg(bytes) : await d.embedPng(bytes);
